<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Profile preview — Dev-Lahrani</title>
<style>
  body{margin:0;background:#d8dcd6;font-family:sans-serif}
  .bar{padding:10px 16px;background:#15314a;color:#eaf4fb;font:13px/1.4 monospace;position:sticky;top:0;z-index:5}
  .bar a{color:#ffb454;margin-left:12px}
  .wrap{width:100%;max-width:1240px;margin:18px auto 60px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);padding:28px 32px;box-sizing:border-box}
  body.dark .wrap{background:#0d1117}
  .md{color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6}
  .md h3{border-bottom:1px solid #d1d9e0;padding-bottom:.3em;margin-top:24px}
  .md table{border-collapse:collapse;width:100%;margin:12px 0;display:table}
  .md th,.md td{border:1px solid #d1d9e0;padding:6px 13px;text-align:left}
  .md th{background:#f6f8fa}
  .md img{max-width:100%}
  .md code{background:#f6f8fa;padding:.2em .4em;border-radius:6px;font-family:ui-monospace,monospace;font-size:85%}
  .md pre{background:#f6f8fa;padding:16px;border-radius:6px;overflow:auto}
  .md pre code{background:none;padding:0}
  .md blockquote{border-left:.25em solid #d1d9e0;margin:0;padding:0 1em;color:#59636e}
  .md details{border:1px solid #d1d9e0;border-radius:6px;padding:10px 16px;margin:12px 0}
  .md summary{cursor:pointer;font-family:ui-monospace,monospace;font-size:13px}
  .md sub{font-size:12px}
  .md samp{font-family:ui-monospace,monospace}
  body.dark .md{color:#e6edf3}
  body.dark .md h3{border-color:#30363d}
  body.dark .md th,body.dark .md td{border-color:#30363d}
  body.dark .md th{background:#161b22}
  body.dark .md code{background:#161b22}
  body.dark .md pre{background:#161b22}
  body.dark .md blockquote{border-color:#30363d;color:#9198a1}
  body.dark .md details{border-color:#30363d}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
<div class="bar">PROFILE PREVIEW — Dev-Lahrani/README.md
  <a href="#" onclick="document.body.classList.toggle('dark');return false">toggle light/dark</a>
  <a href="https://github.com/Dev-Lahrani" target="_blank" rel="noreferrer">open github profile ↗</a>
</div>
<div class="wrap"><div class="md" id="out">loading…</div></div>
<script>
fetch('README.md').then(r=>r.text()).then(t=>{
  // resolve relative picture/img sources so assets load from disk
  document.getElementById('out').innerHTML = marked.parse(t, {gfm:true, breaks:false});
}).catch(e=>{document.getElementById('out').textContent='failed to load README.md — open via a local web server (python3 -m http server)';console.error(e)});
</script>
</body>
</html>
